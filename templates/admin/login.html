<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-page">

<main class="login-box">
  <img class="login-logo" src="{{ url_for('static', filename='img/logo-omp-marca.png') }}" alt="Obras Misionales Pontificias" width="108" height="60">
  <h1>Gestor de contenidos</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <p class="flash flash--{{ category }}">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  <form method="post">
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" autocomplete="username"
             autocapitalize="none" spellcheck="false" autofocus required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Entrar</button>
  </form>

  <p class="login-back"><a href="{{ url_for('index') }}">← Volver al sitio</a></p>
</main>

</body>
</html>
