{% extends "admin/base.html" %}
{% block title %}Contraseña{% endblock %}

{% block content %}
<header class="page-head">
  <div>
    <h1>Cambiar la contraseña</h1>
    <p class="page-help">Se guarda cifrada. Mínimo ocho caracteres.</p>
  </div>
</header>

<form class="card form form--narrow" method="post">
  <div class="field">
    <label for="current">Contraseña actual</label>
    <input id="current" name="current" type="password" autocomplete="current-password" required>
  </div>
  <div class="field">
    <label for="new">Contraseña nueva</label>
    <input id="new" name="new" type="password" autocomplete="new-password" minlength="8" required>
  </div>
  <div class="field">
    <label for="repeat">Repite la contraseña nueva</label>
    <input id="repeat" name="repeat" type="password" autocomplete="new-password" minlength="8" required>
  </div>
  <div class="form-actions">
    <button class="btn" type="submit">Actualizar</button>
  </div>
</form>
{% endblock %}
